apiVersion: apps/v1
kind: Deployment

metadata:
  name: novabank-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: novabank-backend

  template:
    metadata:
      labels:
        app: novabank-backend

    spec:
      containers:
        - name: novabank-backend

          image: belgacemmalek2001/backendpfe:latest

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/fraud_db

            - name: SPRING_DATASOURCE_USERNAME
              value: postgres

            - name: SPRING_DATASOURCE_PASSWORD
              value: "0000"